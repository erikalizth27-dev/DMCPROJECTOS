substitutions:
  _REGION: us-central1
  _REPOSITORY: siniestro-facil
  _SERVICE: siniestro-facil-frontend-prod
  _FRONTEND_SERVICE_ACCOUNT: siniestro-frontend-prod@${PROJECT_ID}.iam.gserviceaccount.com
  _BFF_URL: https://siniestro-facil-bff-prod-6oegsjqmba-uc.a.run.app
  _IDENTITY_PLATFORM_API_KEY: REEMPLAZAR

steps:
  - id: validate
    name: node:22.20.0
    dir: frontend
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npm run typecheck
        npm run build
    env:
      - VITE_API_BASE_URL=${_BFF_URL}/api/v1
      - VITE_IDENTITY_PLATFORM_API_KEY=${_IDENTITY_PLATFORM_API_KEY}

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - PUBLIC_API_BASE_URL=${_BFF_URL}/api/v1
      - --build-arg
      - PUBLIC_IDENTITY_CONFIG=${_IDENTITY_PLATFORM_API_KEY}
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:${_IMAGE_TAG}
      - frontend

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:${_IMAGE_TAG}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --platform=managed
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:${_IMAGE_TAG}
      - --service-account=${_FRONTEND_SERVICE_ACCOUNT}
      - --allow-unauthenticated
      - --no-cpu-boost
      - --min=0
      - --max=10
      - --memory=256Mi
      - --cpu=1
      - --concurrency=80

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:${_IMAGE_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
