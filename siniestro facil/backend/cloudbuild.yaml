substitutions:
  _REGION: us-central1
  _REPOSITORY: siniestro-facil
  _IMAGE_NAME: backend
  _IMAGE_TAG: manual
  _SERVICE: siniestro-facil-backend-piloto
  _MIGRATION_JOB: siniestro-facil-migrator-piloto

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: test
    dir: backend
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --disable-pip-version-check --no-cache-dir ".[test,gcp]"
        python -m compileall -q src tests alembic
        python -m pytest -q

  - id: build
    dir: backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}

  - id: configure-migration
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_MIGRATION_JOB}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
      - --command=alembic
      - --args=upgrade,head

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_MIGRATION_JOB}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --wait

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}

  - id: smoke
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        SERVICE_URL="$$(gcloud run services describe "${_SERVICE}"           --project="$PROJECT_ID"           --region="${_REGION}"           --format='value(status.url)')"
        ID_TOKEN="$$(gcloud auth print-identity-token)"
        python - "$${SERVICE_URL}" "$${ID_TOKEN}" <<'PY'
        import json
        import sys
        from urllib.request import Request, urlopen

        service_url, token = sys.argv[1:3]
        for path, expected in (
            ("/health/live", "ok"),
            ("/health/ready", "ready"),
        ):
            request = Request(
                service_url + path,
                headers={"Authorization": f"Bearer {token}"},
            )
            with urlopen(request, timeout=30) as response:
                body = json.load(response)
            if body.get("status") != expected:
                raise SystemExit(f"{path}: respuesta inesperada {body}")
            print(f"{path}: {expected}")
        PY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
