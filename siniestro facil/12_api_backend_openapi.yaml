openapi: 3.1.0
info:
  title: Siniestro Fácil Backend API
  version: 0.2.0-draft
  description: >-
    Contrato inicial para planning. Las operaciones marcadas POR CONFIRMAR
    dependen de las decisiones de 17_preguntas_abiertas_backend.md.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Siniestros
  - name: Evidencias
  - name: Asistencia
  - name: Presupuestos
  - name: Fraude
  - name: Pagos
  - name: Auditoria
paths:
  /siniestros:
    post:
      tags: [Siniestros]
      summary: Registrar un siniestro
      operationId: crearSiniestro
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CrearSiniestro'}
      responses:
        '201':
          description: Siniestro creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Siniestro'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {$ref: '#/components/responses/ReglaNegocio'}
  /siniestros/{siniestroId}:
    parameters:
      - $ref: '#/components/parameters/SiniestroId'
    get:
      tags: [Siniestros]
      summary: Consultar la vista única de un siniestro
      operationId: obtenerSiniestro
      responses:
        '200':
          description: Vista del siniestro según el rol
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Siniestro'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /siniestros/{siniestroId}/estado:
    post:
      tags: [Siniestros]
      summary: Solicitar una transición de estado
      operationId: cambiarEstadoSiniestro
      parameters:
        - $ref: '#/components/parameters/SiniestroId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstado'
      responses:
        '200': {description: Estado actualizado}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {$ref: '#/components/responses/ReglaNegocio'}
  /siniestros/{siniestroId}/evidencias:
    post:
      tags: [Evidencias]
      summary: Registrar evidencia ya almacenada
      operationId: registrarEvidencia
      parameters:
        - $ref: '#/components/parameters/SiniestroId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegistrarEvidencia'}
      responses:
        '201': {description: Evidencia registrada}
        '409': {$ref: '#/components/responses/Conflicto'}
  /siniestros/{siniestroId}/asistencias:
    post:
      tags: [Asistencia]
      summary: Solicitar asistencia
      operationId: solicitarAsistencia
      parameters:
        - $ref: '#/components/parameters/SiniestroId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SolicitarAsistencia'}
      responses:
        '202': {description: Solicitud aceptada para procesamiento}
        '422': {$ref: '#/components/responses/ReglaNegocio'}
  /siniestros/{siniestroId}/presupuestos:
    post:
      tags: [Presupuestos]
      summary: Registrar presupuesto y diagnóstico
      operationId: registrarPresupuesto
      parameters:
        - $ref: '#/components/parameters/SiniestroId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegistrarPresupuesto'}
      responses:
        '201': {description: Presupuesto registrado}
        '422': {$ref: '#/components/responses/ReglaNegocio'}
  /siniestros/{siniestroId}/alertas:
    get:
      tags: [Fraude]
      summary: Consultar alertas autorizadas para el rol
      operationId: listarAlertas
      parameters:
        - $ref: '#/components/parameters/SiniestroId'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Alertas visibles para el usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/AlertaResumen'
                    - $ref: '#/components/schemas/AlertaDetalle'
                  description: Resumen para operador/ajustador; detalle para investigador/supervisor.
  /alertas/{alertaId}/revision:
    post:
      tags: [Fraude]
      summary: Registrar revisión humana de una alerta
      operationId: revisarAlerta
      parameters:
        - name: alertaId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevisarAlerta'}
      responses:
        '200': {description: Revisión registrada}
        '422': {$ref: '#/components/responses/ReglaNegocio'}
  /siniestros/{siniestroId}/solicitudes-pago:
    post:
      tags: [Pagos]
      summary: Preparar una solicitud de pago
      operationId: prepararSolicitudPago
      parameters:
        - $ref: '#/components/parameters/SiniestroId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PrepararSolicitudPago'}
      responses:
        '201': {description: Solicitud de pago preparada}
        '403': {$ref: '#/components/responses/Prohibido'}
        '422': {$ref: '#/components/responses/ReglaNegocio'}
  /solicitudes-pago/{solicitudPagoId}/autorizacion:
    post:
      tags: [Pagos]
      summary: Autorizar una solicitud de pago
      operationId: autorizarSolicitudPago
      parameters:
        - name: solicitudPagoId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AutorizarSolicitudPago'}
      responses:
        '200': {description: Solicitud de pago autorizada}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '422': {$ref: '#/components/responses/ReglaNegocio'}
  /siniestros/{siniestroId}/linea-tiempo:
    get:
      tags: [Auditoria]
      summary: Consultar la línea de tiempo autorizada
      operationId: obtenerLineaTiempo
      parameters:
        - $ref: '#/components/parameters/SiniestroId'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Eventos visibles para el rol
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EventoLineaTiempo'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT emitido por Identity Platform. Claims requeridos: sub, role,
        actor_type, tenant_id, auth_time, iss, aud, iat y exp.
  parameters:
    SiniestroId:
      name: siniestroId
      in: path
      required: true
      schema: {type: integer, format: int64}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    Limite:
      name: limite
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1}
  schemas:
    CrearSiniestro:
      type: object
      required: [placa, fechaEvento, ubicacionEvento, tipoEvento, medioContacto]
      properties:
        numeroPoliza: {type: string}
        numeroDocumento: {type: string}
        placa: {type: string}
        fechaEvento: {type: string, format: date-time}
        ubicacionEvento: {type: string}
        tipoEvento: {type: string}
        medioContacto: {type: string}
      anyOf:
        - required: [numeroPoliza]
        - required: [numeroDocumento]
      example:
        numeroPoliza: POL-SYN-001
        placa: SYN0001
        fechaEvento: '2026-08-25T14:30:00Z'
        ubicacionEvento: Ubicación sintética de prueba
        tipoEvento: colision
        medioContacto: synthetic@example.invalid
    Siniestro:
      type: object
      required: [id, estadoActual, fechaEvento, tipoEvento]
      properties:
        id: {type: integer, format: int64}
        estadoActual: {$ref: '#/components/schemas/EstadoSiniestro'}
        fechaEvento: {type: string, format: date-time}
        tipoEvento: {type: string}
        siguientePaso: {type: string}
      example:
        id: 1001
        estadoActual: reportado
        fechaEvento: '2026-08-25T14:30:00Z'
        tipoEvento: colision
        siguientePaso: validar_cobertura
    RegistrarEvidencia:
      type: object
      required: [tipoEvidencia, contenidoOriginalUri, hash]
      properties:
        tipoEvidencia: {type: string}
        contenidoOriginalUri: {type: string, format: uri}
        hash: {type: string}
        fechaCaptura: {type: string, format: date-time}
        fuente: {type: string}
        versionDerivadaDe: {type: integer, format: int64}
      additionalProperties: false
      example:
        tipoEvidencia: fotografia
        contenidoOriginalUri: https://example.invalid/evidencias/SYN-001.jpg
        hash: sha256-sintetico-no-real
        fechaCaptura: '2026-08-25T14:35:00Z'
        fuente: asegurado
    CambiarEstado:
      type: object
      required: [estadoDestino, motivo, version]
      properties:
        estadoDestino: {$ref: '#/components/schemas/EstadoSiniestro'}
        motivo: {type: string, minLength: 1, maxLength: 500}
        version: {type: integer, minimum: 0}
      additionalProperties: false
      example:
        estadoDestino: validando_cobertura
        motivo: Inicio de validación
        version: 0
    SolicitarAsistencia:
      type: object
      required: [tipoProveedor, ubicacion]
      properties:
        tipoProveedor: {type: string, minLength: 1, maxLength: 30}
        ubicacion: {type: string, minLength: 1, maxLength: 255}
      additionalProperties: false
      example:
        tipoProveedor: grua
        ubicacion: Ubicación sintética de prueba
    RegistrarPresupuesto:
      type: object
      required: [proveedorId, vigenciaDesde, vigenciaHasta]
      properties:
        proveedorId: {type: integer, format: int64, minimum: 1}
        diagnostico: {type: string}
        vigenciaDesde: {type: string, format: date}
        vigenciaHasta: {type: string, format: date}
      additionalProperties: false
      example:
        proveedorId: 501
        diagnostico: Diagnóstico sintético
        vigenciaDesde: '2026-08-25'
        vigenciaHasta: '2026-09-24'
    RevisarAlerta:
      type: object
      required: [estadoRevision, justificacion]
      properties:
        estadoRevision:
          type: string
          enum: [confirmada, descartada, en_solicitud_info]
        justificacion: {type: string, minLength: 1, maxLength: 2000}
      additionalProperties: false
      example:
        estadoRevision: en_solicitud_info
        justificacion: Requiere evidencia adicional
    PrepararSolicitudPago:
      type: object
      required: [monto]
      properties:
        monto: {type: number, exclusiveMinimum: 0, multipleOf: 0.01}
      additionalProperties: false
      example:
        monto: 1250.50
    AutorizarSolicitudPago:
      type: object
      required: [confirmacionHumana]
      properties:
        confirmacionHumana:
          type: boolean
          const: true
          description: Confirmación explícita del supervisor.
      additionalProperties: false
      example:
        confirmacionHumana: true
    AlertaResumen:
      type: object
      required: [id, severidad, estadoRevision]
      properties:
        id: {type: integer, format: int64}
        severidad: {type: string}
        estadoRevision: {type: string}
      additionalProperties: false
      example:
        id: 701
        severidad: alta
        estadoRevision: pendiente
    AlertaDetalle:
      allOf:
        - $ref: '#/components/schemas/AlertaResumen'
        - type: object
          required: [tipo, detalle]
          properties:
            tipo: {type: string}
            detalle: {type: object}
          additionalProperties: false
      example:
        id: 701
        severidad: alta
        estadoRevision: pendiente
        tipo: coincidencia
        detalle:
          regla: R-SYN-01
    EventoLineaTiempo:
      type: object
      required: [id, tipoEvento, fecha]
      properties:
        id: {type: integer, format: int64}
        tipoEvento: {type: string}
        fecha: {type: string, format: date-time}
        detalle: {type: object}
      example:
        id: 801
        tipoEvento: siniestro_reportado
        fecha: '2026-08-25T14:31:00Z'
        detalle:
          origen: ejemplo_sintetico
    EstadoSiniestro:
      type: string
      enum: [reportado, validando_cobertura, asistencia_coordinada, evidencia_pendiente, en_evaluacion, inspeccion_programada, presupuesto_recibido, autorizado, observado, rechazado, en_reparacion, listo_para_entrega, indemnizado, cerrado]
    Error:
      type: object
      required: [codigo, mensaje, correlationId]
      properties:
        codigo: {type: string}
        mensaje: {type: string}
        correlationId: {type: string}
        detalles: {type: array, items: {type: string}}
      example:
        codigo: SF-SYN-ERROR
        mensaje: Mensaje sintético sin información sensible
        correlationId: corr-syn-0001
        detalles: []
  responses:
    NoAutenticado:
      description: Token ausente, inválido o vencido
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            codigo: AUTH-001
            mensaje: Autenticación requerida
            correlationId: corr-syn-0001
            detalles: []
    Prohibido:
      description: El rol autenticado no puede ejecutar la operación
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            codigo: AUTH-003
            mensaje: Operación no permitida para el rol
            correlationId: corr-syn-0001
            detalles: []
    NoEncontrado:
      description: Recurso no encontrado o no visible para el rol
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            codigo: RESOURCE-404
            mensaje: Recurso no encontrado
            correlationId: corr-syn-0001
            detalles: []
    Conflicto:
      description: Conflicto de estado, duplicidad o idempotencia
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            codigo: CONFLICT-409
            mensaje: Conflicto con el estado actual
            correlationId: corr-syn-0001
            detalles: []
    ReglaNegocio:
      description: Solicitud válida sintácticamente que incumple una regla de negocio
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            codigo: BUSINESS-422
            mensaje: Regla de negocio incumplida
            correlationId: corr-syn-0001
            detalles: []
